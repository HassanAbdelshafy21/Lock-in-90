name: keepalive
# GitHub pauses scheduled jobs after 60 days without repo activity. This commits a timestamp every 2 weeks.
on:
  schedule:
    - cron: '23 4 1,15 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%FT%TZ > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "keepalive" || exit 0
          git push

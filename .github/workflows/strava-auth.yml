name: strava-connect
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Paste the full localhost address (or just the code) from the Strava approval page'
        required: true
jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix scripts --no-audit --no-fund
      - run: node scripts/strava-auth.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_CODE: ${{ inputs.code }}

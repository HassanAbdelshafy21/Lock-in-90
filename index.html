<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lock In 90</title>
<meta name="theme-color" content="#283A58">
<meta name="description" content="90-day challenge tracker: meals, water, training, supplements, calisthenics and stamina. Works offline and syncs.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lock In 90">
<link rel="preload" href="fonts/Alexandria.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main class="wrap" id="main"><div class="card hint">Loading…</div></main>
<nav class="tabs" id="tabs" aria-label="Sections" hidden><div class="tabs-in">
  <button data-act="tab" data-v="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>Today</button>
  <button data-act="tab" data-v="train"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="M5 9h14M12 9v6l-3 6M12 15l3 6"/></svg>Train</button>
  <button class="tab-add" data-act="quick" aria-label="Quick add"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-act="tab" data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
  <button data-act="tab" data-v="setup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Me</button>
</div></nav>
<div class="scrim" id="panel" hidden></div>
<div class="scrim" id="sheet" hidden></div>
<div class="timer" id="timer" hidden></div>
<div class="cele" id="cele" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Locked In</title>
<meta name="theme-color" content="#0B0F14">
<meta name="description" content="90-day challenge tracker: meals, water, training, supplements, calisthenics and stamina. Works offline and syncs.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Locked In">
<link rel="preload" href="fonts/Alexandria.ttf" as="font" type="font/ttf" crossorigin>
<script>try{var t=localStorage.getItem('lk-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>#boot{position:fixed;inset:0;z-index:100;background:#0B0F14;display:grid;place-items:center;align-content:center;gap:0;transition:opacity .3s}#boot.off{opacity:0;pointer-events:none}#boot .boot-i{width:240px;height:240px;animation:bootp 1.4s ease-in-out .5s infinite alternate}#boot b{position:absolute;bottom:calc(64px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#22D3EE;font:800 15px/1 system-ui,sans-serif;letter-spacing:.32em;opacity:0;animation:bootf .4s ease .3s forwards}@keyframes bootp{to{transform:scale(1.06)}}@keyframes bootf{to{opacity:.9}}@media (prefers-reduced-motion:reduce){#boot .boot-i{animation:none}}</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="boot" aria-hidden="true"><svg class="boot-i" viewBox="0 0 512 512"><defs><linearGradient id="bootg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A3E635"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs><circle cx="256" cy="256" r="170" fill="#131922"/><g transform="translate(256 256) scale(.5) translate(-256 -256)"><rect x="70" y="170" width="46" height="172" rx="18" fill="#fff"/><rect x="124" y="204" width="36" height="104" rx="14" fill="#fff"/><rect x="396" y="170" width="46" height="172" rx="18" fill="#fff"/><rect x="352" y="204" width="36" height="104" rx="14" fill="#fff"/><path d="M160 256h40l24-70 30 150 30-210 24 160 16-30h28" fill="none" stroke="url(#bootg)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/></g></svg><b>LOCKED IN</b></div>
<header class="top"><div class="top-in" id="top"></div></header>
<main class="wrap" id="main"><div class="card hint">Loading…</div></main>
<nav class="tabs" id="tabs" aria-label="Sections" hidden><div class="tabs-in">
  <button data-act="tab" data-v="today"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2zM8.5 12.5l2.5 2.5 4.5-5"/></svg></span>Today</button>
  <button data-act="tab" data-v="train"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg></span>Train</button>
  <button data-act="tab" data-v="food"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3v6a3 3 0 0 0 6 0V3M9 3v18M17 3c-2 0-3 3-3 7h3v11"/></svg></span>Food</button>
  <button data-act="tab" data-v="body"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l2-4 3 8 2-4h7"/></svg></span>Body</button>
  <button data-act="tab" data-v="setup"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>You</button>
</div></nav>
<button class="fab" id="fab" data-act="quick" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Log</button>
<div class="scrim" id="panel" hidden></div>
<div class="scrim" id="sheet" hidden></div>
<div class="timer" id="timer" hidden></div>
<div class="cele" id="cele" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>

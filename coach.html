<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lock In 90 · Coach view</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14213D">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="preload" href="fonts/Alexandria.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:Alexandria;src:url(fonts/Alexandria.ttf) format("truetype");font-weight:100 900;font-display:swap}
:root{--bg:#EEF1F4;--surface:#fff;--surface-2:#EEF1F4;--ink:#14213D;--ink-2:#56627A;--muted:#8A96AE;--line:#E6EAF0;--hdr:#14213D;--hdr-fg:#fff;--hdr-mute:#9FB0D0;--good:#2FA36B;--good-soft:#DDF3E7;--bad:#D9534F;--bad-soft:#FBE3E2;--spark:#F2B33D;--water:#3D8BFD;
--f-body:Alexandria,system-ui,sans-serif;--f-display:Alexandria,system-ui,sans-serif;--f-mono:Alexandria,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0F1420;--surface:#182032;--surface-2:#1F2A40;--ink:#EEF2F8;--ink-2:#A6B1C8;--muted:#6E7A93;--line:#222C40;--hdr:#0F1420;--good:#4ADE9B;--good-soft:#173528;--bad:#FF7A72;--bad-soft:#3D2220;--spark:#F5B942;--water:#5EB0FF}}
:root[lang="ar"] *{letter-spacing:0!important}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
header{background:var(--hdr);color:var(--hdr-fg);padding:18px 16px 24px;border-radius:0 0 26px 26px}
.in{max-width:900px;margin:0 auto;padding:0 16px}
header .in{padding:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12px;color:var(--hdr-mute);}
.brand img{width:30px;height:30px;border-radius:8px}
h1{margin:12px 0 2px;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,7vw,40px);line-height:1.05;overflow-wrap:anywhere}
.sub{color:var(--hdr-mute);font-size:13.5px}
.lang{border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--hdr-fg);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px}
main{padding:16px 0 40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--surface);border:0;border-radius:18px;box-shadow:0 1px 2px rgba(20,33,61,.06);padding:12px 14px;display:grid;gap:2px}
.k b{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1}
.k span{font-size:12px;color:var(--muted);}
.k small{color:var(--ink-2);font-size:12.5px}
.card{background:var(--surface);border:0;border-radius:22px;box-shadow:0 1px 2px rgba(20,33,61,.06);padding:14px 16px;margin-bottom:14px}
h2{margin:0 0 10px;font-weight:700;font-size:19px;}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:720px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:500}
td.num,.num{font-variant-numeric:tabular-nums}
.ok{color:var(--good);font-weight:600}.no{color:var(--bad);font-weight:600}.mut{color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600}
.pill.ok{background:var(--good-soft)}.pill.no{background:var(--bad-soft)}
.note{white-space:normal;max-width:260px;color:var(--ink-2);font-style:italic}
.miss{white-space:normal;max-width:240px;color:var(--bad);font-size:12px}
.hint{color:var(--ink-2);font-size:13px}
.err{margin:40px auto;max-width:420px;text-align:center}
svg text{font-family:var(--f-mono)}
:root[lang="ar"] .num,:root[lang="ar"] td.num{direction:ltr;unicode-bidi:isolate}
</style>
</head>
<body>
<header><div class="in" id="hdr"><div class="top"><div class="brand"><img src="icons/logo.svg" alt="">Lock In 90 · Coach view</div></div><h1>Loading…</h1></div></header>
<main class="in" id="main"></main>
<script type="module" src="coach.js"></script>
</body>
</html>
